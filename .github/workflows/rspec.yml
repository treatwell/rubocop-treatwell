name: RSpec
on: [push]
jobs:
  run-rspec:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04; setup-ruby has no builds for Ruby 2.7 there.
        os: [ubuntu-24.04, macos-latest]
        ruby: ['2.7', '3.0', '3.1', '3.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run rspec
        run: bundle exec rspec
